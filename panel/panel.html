<!DOCTYPE html>
<html lang="en">
<head>
    <title></title>
    <script type="module" src="panel.js" defer></script>
    <link rel="stylesheet" href="panel.css">
</head>
<body style="min-width: 200px;">
    <div class="header">
        <img src="../images/icon-128.png" alt="WidevineProxy Icon" width="64"/>
        <img id="textImage" src="../images/proxy_text.png" alt="ProxyText" width="200"/>
    </div>
    <fieldset>
        <legend>Configuracion</legend>
        <div id="settings">
            <!-- Enabled -->
            <div>
                <input type="checkbox" id="enabled">
                <label for="enabled"> Activar</label>
            </div>
            <!-- Dark mode -->
            <div>
                <label class="switch">
                    <input type="checkbox" id="darkModeToggle">
                    <span class="slider"></span>
                </label>
                <label for="enabled"> Oscuro</label>
            </div>
            <!-- Type select -->
            <div id="type-select">
                <a>Modo:</a><br>
                <input type="radio" id="wvd_select" name="cdm_type" value="wvd">
                <label for="wvd_select">Android</label><br>
                <input type="radio" id="remote_select" name="cdm_type" value="remote">
                <label for="remote_select">Remote</label><br>
            </div>
        </div>
        <fieldset id="wvd">
            <legend>Android</legend>
            <button type="button" id="fileInput">Cargar</button>
            <button type="button" id="remove">Eliminar</button>
            <button type="button" id="download">Descargar</button><br>
            <label>
                <select id="wvd-combobox"></select>
            </label>
        </fieldset>
        <fieldset id="remote">
            <legend>Remote</legend>
            <button type="button" id="remoteInput">Cargar remote.json</button>
            <button type="button" id="remoteRemove">Eliminar</button>
            <button type="button" id="remoteDownload">Descargar</button><br>
            <label>
                <select id="remote-combobox"></select>
            </label>
        </fieldset>
        <fieldset id="command-options">
            <legend>Comando</legend>
            <input type="checkbox" id="use-shaka">
            <label for="use-shaka"> Usar Paquete</label><br>
            <label for="downloader-name">Ejecutar: </label>
            <input type="text" class="text-box" id="downloader-name">
        </fieldset>
        <button type="button" id="export">Guardar logs</button>
    </fieldset>
    <fieldset>
        <legend>Keys</legend>
        <button type="button" id="clear">Clear</button>
        <div id="key-container"></div>
    </fieldset>
</body>
</html>
